apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-estudantes
  labels:
    app: portal-estudantes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-estudantes
  template:
    metadata:
      labels:
        app: portal-estudantes
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80

          # Resources: garante que o scheduler reserve recursos mínimos (requests)
          # e impede que o container consuma além do limite (limits).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # ReadinessProbe: só envia tráfego ao pod quando ele responde HTTP 200.
          # Evita que requisições cheguem a um container ainda inicializando.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          # LivenessProbe: reinicia o container se ele parar de responder.
          # Protege contra travamentos silenciosos.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          # SecurityContext: reduz a superfície de ataque.
          # - runAsNonRoot: impede execução como root.
          # - readOnlyRootFilesystem: bloqueia escrita no filesystem (exceto volumes).
          # - allowPrivilegeEscalation: impede que o processo ganhe mais privilégios.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101        # usuário 'nginx' na imagem alpine
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: portal-estudantes
spec:
  selector:
    app: portal-estudantes
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
