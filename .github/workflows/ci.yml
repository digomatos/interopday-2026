# ============================================================
# CI Pipeline - Demo de Infraestrutura e Automação
# ============================================================
# Este workflow demonstra conceitos fundamentais de CI/CD:
#   - Triggers (quando o pipeline executa)
#   - Jobs e Steps (unidades de trabalho)
#   - Dependência entre jobs (needs)
#   - Validação de infraestrutura como código (IaC)
# ============================================================

name: ci-demo

# ── TRIGGERS ────────────────────────────────────────────────
# Define QUANDO este workflow será executado.
on:
  pull_request:          # Executa em qualquer Pull Request
  push:
    branches: [main]     # Executa em pushes na branch main
  workflow_dispatch:     # Permite execução manual (botão na UI)

# ── JOBS ────────────────────────────────────────────────────
# Cada job roda em um runner isolado (container/VM).
jobs:

  # ─── Job 1: Lint e validação de sintaxe ───────────────────
  lint:
    name: "🔍 Lint - Validação de sintaxe YAML"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        # Clona o repositório no runner para que possamos acessar os arquivos

      - name: Instalar yamllint
        run: pip install yamllint

      - name: Validar sintaxe YAML dos manifestos
        run: |
          echo "📋 Validando arquivos YAML em k8s/..."
          yamllint k8s/ || echo "⚠️ Avisos de lint encontrados"

  # ─── Job 2: Validação do manifesto Kubernetes ─────────────
  validate-k8s:
    name: "☸️ Validar Manifesto Kubernetes"
    runs-on: ubuntu-latest
    needs: lint  # ⬅️ Só executa APÓS o job 'lint' passar
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3
        # kubectl é a CLI oficial do Kubernetes

      - name: Dry-run do manifesto
        run: |
          echo "🚀 Simulando aplicação do manifesto (dry-run)..."
          echo "   Isso valida a estrutura sem aplicar no cluster."
          kubectl apply --dry-run=client -f k8s/deployment.yaml
          echo "✅ Manifesto válido!"

  # ─── Job 3: Resumo final ──────────────────────────────────
  summary:
    name: "📊 Resumo do Pipeline"
    runs-on: ubuntu-latest
    needs: [lint, validate-k8s]  # ⬅️ Depende de AMBOS os jobs anteriores
    if: always()  # Executa mesmo se jobs anteriores falharem
    steps:
      - name: Exibir resultado
        run: |
          echo "═══════════════════════════════════════════"
          echo "  Pipeline CI finalizado!"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Autor:  ${{ github.actor }}"
          echo "═══════════════════════════════════════════"
